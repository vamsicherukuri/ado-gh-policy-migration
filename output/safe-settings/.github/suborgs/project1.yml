suborgrepos:
  - project1
  - sample2
  - sample3
  - sample4
repository:
  allow_squash_merge: true
rulesets:
  - name: project1-refs-heads-policy-lab--blocking
    target: branch
    enforcement: active
    conditions:
      ref_name:
        include:
          - "refs/heads/policy-lab/**"
        exclude: []
    rules:
      - type: pull_request
        parameters:
          required_approving_review_count: 2
          dismiss_stale_reviews_on_push: true
          require_code_owner_review: false
          require_last_push_approval: false
          required_review_thread_resolution: true
          allowed_merge_methods:
            - squash
      - type: required_status_checks
        parameters:
          strict_required_status_checks_policy: true
          required_status_checks:
            - context: policy-lab-sample3
            - context: status-check
      - type: non_fast_forward
      - type: deletion
  - name: project1-push-blocking
    target: push
    enforcement: active
    rules:
      - type: file_path_restriction
        parameters:
          restricted_file_paths:
            - "/policy-lab-blocked/*"
            - "*/policy-lab-blocked/*"
      - type: max_file_path_length
        parameters:
          max_file_path_length: 180
      - type: max_file_size
        parameters:
          max_file_size: 1
  - name: project1-commit-metadata-blocking
    target: branch
    enforcement: active
    conditions:
      ref_name:
        include:
          - "~ALL"
        exclude: []
    rules:
      - type: commit_author_email_pattern
        parameters:
          operator: ends_with
          pattern: "@MngEnvMCAP267305.onmicrosoft.com"
          negate: false
